<svg xmlns="http://www.w3.org/2000/svg" width="640" height="900" viewBox="0 0 640 900" role="img" aria-labelledby="title desc">
  <title id="title">realTasia system architecture</title>
  <desc id="desc">The application calls the API. The API uses common models and sends background work to the queue. The queue updates common feed and notification state. Sockets deliver live updates back to the application. Deployment supports the application, API and queue.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff7a00"/>
    </marker>
    <style>
      .box { fill: #161b22; stroke: #ff7a00; stroke-width: 3; }
      .name { fill: #f0f6fc; font: 700 25px system-ui, sans-serif; }
      .role { fill: #9da7b3; font: 17px system-ui, sans-serif; }
      .line { fill: none; stroke: #ff7a00; stroke-width: 3; marker-end: url(#arrow); }
      .label { fill: #ffb066; font: 600 15px system-ui, sans-serif; }
      .deploy { fill: #22272e; stroke: #6e7681; stroke-width: 2; }
    </style>
  </defs>
  <rect width="640" height="900" rx="28" fill="#0d1117"/>

  <rect class="box" x="150" y="55" width="340" height="92" rx="18"/>
  <text class="name" x="320" y="92" text-anchor="middle">app-rta</text>
  <text class="role" x="320" y="122" text-anchor="middle">product + browser application</text>

  <path class="line" d="M320 147 L320 207"/>
  <text class="label" x="337" y="183">requests</text>

  <rect class="box" x="150" y="210" width="340" height="92" rx="18"/>
  <text class="name" x="320" y="247" text-anchor="middle">api-rta</text>
  <text class="role" x="320" y="277" text-anchor="middle">OAuth + product rules</text>

  <path class="line" d="M275 302 L205 382"/>
  <path class="line" d="M365 302 L435 382"/>
  <text class="label" x="186" y="350">domain</text>
  <text class="label" x="421" y="350">jobs</text>

  <rect class="box" x="55" y="385" width="250" height="105" rx="18"/>
  <text class="name" x="180" y="426" text-anchor="middle">common-rta</text>
  <text class="role" x="180" y="456" text-anchor="middle">models, Ticker</text>
  <text class="role" x="180" y="479" text-anchor="middle">+ notifications</text>

  <rect class="box" x="335" y="385" width="250" height="105" rx="18"/>
  <text class="name" x="460" y="426" text-anchor="middle">queue-rta</text>
  <text class="role" x="460" y="456" text-anchor="middle">background</text>
  <text class="role" x="460" y="479" text-anchor="middle">consequences</text>

  <path class="line" d="M335 445 L305 445"/>
  <text class="label" x="320" y="430" text-anchor="middle">projects</text>

  <path class="line" d="M180 490 L180 575"/>
  <text class="label" x="195" y="541">events</text>

  <rect class="box" x="150" y="578" width="340" height="92" rx="18"/>
  <text class="name" x="320" y="615" text-anchor="middle">sockets-rta</text>
  <text class="role" x="320" y="645" text-anchor="middle">live last-mile delivery</text>

  <path class="line" d="M490 624 C590 624 592 101 490 101"/>
  <text class="label" x="548" y="355" text-anchor="middle" transform="rotate(-90 548 355)">live updates</text>

  <rect class="deploy" x="75" y="755" width="490" height="92" rx="18"/>
  <text class="name" x="320" y="792" text-anchor="middle">deployment-rta</text>
  <text class="role" x="320" y="822" text-anchor="middle">machines, traffic + release automation</text>

  <path class="line" d="M145 755 C70 680 70 210 150 101"/>
  <path class="line" d="M320 755 L320 670"/>
  <path class="line" d="M495 755 C590 675 600 515 555 470"/>
  <text class="label" x="76" y="690">runs</text>
  <text class="label" x="337" y="718">ships</text>
</svg>
